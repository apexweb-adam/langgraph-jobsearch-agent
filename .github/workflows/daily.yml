name: Daily job discovery

# Runs the full LangGraph pipeline (Greenhouse + Lever + JazzHR + Apify Indeed)
# once a day at 13:00 UTC (~9 AM US Eastern). Results land in Supabase, which
# the Next.js dashboard reads.
#
# Why GitHub Actions instead of running locally: the full pipeline takes
# 25-30 minutes (4 Apify Indeed actors x 5-7 min sequential + Gemini scoring
# on ~125 jobs). GitHub-hosted runners have a 6-hour job timeout, so this fits
# easily without the shell-harness kill we hit on local laptops.

on:
  schedule:
    # Cost-tiered refresh. Greenhouse + Lever are plain free HTTP APIs, so
    # they refresh 4x/day. Indeed via Apify burns residential-proxy credits
    # (Playwright + detail pages), so it runs ONCE a day at 12:00 UTC.
    # The two cron strings are distinguished in the env block below via
    # github.event.schedule.
    - cron: "0 12 * * *"         # full run: free sources + Apify Indeed
    - cron: "0 0,6,18 * * *"     # cheap run: free sources only (no Apify)
  workflow_dispatch:             # manual trigger = full run (incl. Apify)

# Avoid two concurrent runs racing on the same Supabase table
concurrency:
  group: daily-job-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120         # 700+ jobs/run since JobSpy; parallel scoring needs headroom

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install --upgrade pip uv

      - name: Install project deps
        run: uv pip install --system -e .

      - name: Stage candidate profile from Actions secret
        env:
          DIAMOND_PROFILE_YAML: ${{ secrets.DIAMOND_PROFILE_YAML }}
        run: |
          mkdir -p data
          printf '%s' "$DIAMOND_PROFILE_YAML" > data/profile.yaml
          # Sanity: just print the candidate name + first 3 lines so logs prove
          # the profile loaded without dumping the whole yaml.
          head -3 data/profile.yaml || true

      - name: Run discovery + scoring + Supabase upsert
        env:
          GOOGLE_API_KEY:            ${{ secrets.GOOGLE_API_KEY }}
          # APIFY_TOKEN is only injected on the 12:00 UTC full run and on
          # manual dispatches. The cheap 6-hourly crons get an empty token,
          # and src/sources/apify.py skips all Apify sources when the token
          # is unset — so those runs cost zero Apify credits.
          APIFY_TOKEN:               ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 12 * * *') && secrets.APIFY_TOKEN || '' }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_TABLE:            langgraph_jobs
          APPROVAL_MODE:             dashboard
          PROFILE_PATH:              ./data/profile.yaml
          PYTHONUNBUFFERED:          "1"
        # -u disables stdout buffering so progress lines flush in real time
        # instead of going dark for the whole 30+ minute run. Made debugging
        # the multi-actor hang much easier.
        run: python -u run.py

      - name: Upload logs as artifact (for postmortem on failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-logs-${{ github.run_id }}
          path: |
            data/*.db
          retention-days: 7
          if-no-files-found: ignore
