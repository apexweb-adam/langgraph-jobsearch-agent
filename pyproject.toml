[project]
name = "berniesbaby-jobsearch"
version = "0.1.0"
description = "LangGraph-orchestrated job discovery + scoring + HITL approval for berniesbaby"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.50",
    "langchain-core>=0.3.20",
    "langchain-google-genai>=2.0.5",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.4",
    "rich>=13.7.0",
]

[tool.setuptools]
packages = ["src"]
